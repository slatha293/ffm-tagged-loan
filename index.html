
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Branch Territories, Village Territories and Loan Points</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* Green branch pin */
    .branch-pin-wrapper {
      background: transparent;
      border: none;
    }

    .branch-pin {
      position: relative;
      width: 10px;
      height: 10px;
      background: linear-gradient(
        135deg, #4CAF50 0%, #006400 50%, #003300 100%
      );
      border: 1px solid #003300;
      border-radius: 50%;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    .branch-pin::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      left: 50%;
      bottom: -3px;
      background: #006400;
      border-right: 1px solid #003300;
      border-bottom: 1px solid #003300;
      transform: translateX(-50%) rotate(45deg);
      z-index: -1;
    }

    /* Branch search */
    #branch-search {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;
      display: flex;
      gap: 5px;
      background: white;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    #branchSearchInput {
      width: 220px;
      padding: 8px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 14px;
    }

    #branch-search button {
      background: #006400;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    #branch-search button:hover {
      background: #004d00;
    }

    /* Loading/error message */
    #map-status {
      position: absolute;
      bottom: 15px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 8px;
      border-radius: 5px;
      font-size: 12px;
      max-width: 80%;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div id="branch-search">
    <input
      type="text"
      id="branchSearchInput"
      placeholder="Enter branch name..."
    >
    <button type="button" id="searchBranchButton">Search</button>
  </div>

  <div id="map"></div>
  <div id="map-status">Initializing map...</div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --------------------------------------------------
    // 1. INITIALIZE MAP
    // --------------------------------------------------

    const map = L.map('map');

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const statusBox = document.getElementById('map-status');

    // --------------------------------------------------
    // 2. BRANCH NAME HELPER
    // --------------------------------------------------

    function getBranchName(properties) {
      const p = properties || {};

      const value =
        p.branch ??
        p.Branch ??
        p.BRANCH ??
        p.branch_name ??
        p.Branch_Name ??
        p.BranchName ??
        p.branchName ??
        p.branch_nm ??
        p.BRANCH_NAME ??
        p.territory ??
        p.Territory;

      return String(value ?? 'Unassigned').trim() || 'Unassigned';
    }

    // --------------------------------------------------
    // 3. BRANCH COLORS
    // --------------------------------------------------

    const branchColors = [
      '#e6194b', '#3cb44b', '#4363d8', '#f58231',
      '#911eb4', '#008080', '#f032e6', '#9a6324',
      '#469990', '#d62728', '#1f77b4', '#bcbd22',
      '#17becf', '#e377c2', '#2ca02c', '#9467bd',
      '#ff7f0e', '#7f7f7f', '#006400', '#b03060'
    ];

    function getBranchColor(branchName) {
      let hash = 0;
      const name = String(branchName).trim().toLowerCase();

      for (let i = 0; i < name.length; i++) {
        hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      }

      return branchColors[hash % branchColors.length];
    }

    // --------------------------------------------------
    // 4. BRANCH TERRITORY POLYGONS
    // --------------------------------------------------

    const territoryLayer = L.geoJSON(null, {
      style: function(feature) {
        const branch = getBranchName(feature.properties);

        return {
          color: '#00008B',
          weight: 2,
          fillColor: getBranchColor(branch),
          fillOpacity: 0.30
        };
      },

      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};
        const branch = getBranchName(p);

        const details = Object.entries(p)
          .map(([key, value]) => `${key}: ${value ?? ''}`)
          .join('<br>');

        layer.bindPopup(
          `<strong>Branch Territory: ${branch}</strong><br>${details}`
        );

        layer.on('mouseover', function() {
          layer.setStyle({
            color: '#00008B',
            weight: 3,
            fillOpacity: 0.45
          });
        });

        layer.on('mouseout', function() {
          territoryLayer.resetStyle(layer);
        });
      }
    });

    // --------------------------------------------------
    // 5. LOAN POINTS
    // --------------------------------------------------

    const loanPointsLayer = L.geoJSON(null, {
      pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 5,
          color: '#a61c00',
          weight: 1,
          fillColor: '#ff4d4d',
          fillOpacity: 0.9
        });
      },

      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};

        const fields = [
          ['Branch', getBranchName(p)],
          ['Loan ID', p.loan_id ?? p.Loan_Id ?? p.Loan_ID],
          ['Latitude', p.latitude ?? p.avg_latitu],
          ['Longitude', p.longitude ?? p.avg_longit]
        ];

        const details = fields
          .map(([label, value]) =>
            `${label}: ${value ?? 'Not available'}`
          )
          .join('<br>');

        layer.bindPopup(
          `<strong>Loan Point Details</strong><br>${details}`
        );
      }
    });

    // --------------------------------------------------
    // 6. BRANCH PIN ICON
    // Define the icon BEFORE creating branchLayer.
    // --------------------------------------------------

    const branchPinIcon = L.divIcon({
      className: 'branch-pin-wrapper',
      html: '<div class="branch-pin"></div>',
      iconSize: [10, 13],
      iconAnchor: [5, 13],
      popupAnchor: [0, -13]
    });

    // --------------------------------------------------
    // 7. BRANCH POINTS
    // IMPORTANT: branchLayer is declared only once.
    // --------------------------------------------------

    const branchLayer = L.geoJSON(null, {
      pointToLayer: function(feature, latlng) {
        return L.marker(latlng, {
          icon: branchPinIcon,
          title: getBranchName(feature.properties)
        });
      },

      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};
        const branch = getBranchName(p);

        const details = Object.entries(p)
          .map(([key, value]) => `${key}: ${value ?? ''}`)
          .join('<br>');

        layer.bindPopup(
          `<strong>Branch: ${branch}</strong><br>${details}`
        );
      }
    });

    // --------------------------------------------------
    // 8. VILLAGE BOUNDARIES
    // --------------------------------------------------

    const villageLayer = L.geoJSON(null, {
      style: function(feature) {
        return {
          color: '#404040',
          weight: 0.5,
          fillColor: '#F8F5E9',
          fillOpacity: 0.20
        };
      },

      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};
        const branch = getBranchName(p);

        const details = Object.entries(p)
          .map(([key, value]) => `${key}: ${value ?? ''}`)
          .join('<br>');

        layer.bindPopup(
          `<strong>Village Territory</strong><br>
           <strong>Branch: ${branch}</strong><br>${details}`
        );

        layer.on('mouseover', function() {
          layer.setStyle({
            weight: 1.5,
            fillOpacity: 0.45
          });
        });

        layer.on('mouseout', function() {
          villageLayer.resetStyle(layer);
        });
      }
    });

    // --------------------------------------------------
    // 9. BRANCH SEARCH
    // Search branch points and territory polygons.
    // --------------------------------------------------

    function searchBranch() {
      const input = document.getElementById('branchSearchInput');
      const searchText = input.value.trim().toLowerCase();

      if (!searchText) {
        alert('Please enter a branch name.');
        input.focus();
        return;
      }

      let exactMatch = null;
      let partialMatch = null;

      function checkLayer(layer, sourceLayer) {
        if (!layer.feature) return;

        const branchName = getBranchName(
          layer.feature.properties
        ).toLowerCase();

        const result = {
          layer: layer,
          source: sourceLayer
        };

        if (branchName === searchText && !exactMatch) {
          exactMatch = result;
        } else if (
          branchName.includes(searchText) &&
          !partialMatch
        ) {
          partialMatch = result;
        }
      }

      branchLayer.eachLayer(function(layer) {
        checkLayer(layer, branchLayer);
      });

      territoryLayer.eachLayer(function(layer) {
        checkLayer(layer, territoryLayer);
      });

      const match = exactMatch || partialMatch;

      if (!match) {
        alert('Branch not found. Check the branch name in your GeoJSON.');
        return;
      }

      const layer = match.layer;
      const source = match.source;

      if (!map.hasLayer(source)) {
        source.addTo(map);
      }

      if (typeof layer.getBounds === 'function') {
        const bounds = layer.getBounds();

        if (bounds.isValid()) {
          map.fitBounds(bounds, {
            padding: [30, 30],
            maxZoom: 15
          });
        }
      } else if (typeof layer.getLatLng === 'function') {
        map.setView(layer.getLatLng(), 15);
      }

      layer.openPopup();
    }

    document.getElementById('searchBranchButton')
      .addEventListener('click', searchBranch);

    document.getElementById('branchSearchInput')
      .addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          searchBranch();
        }
      });

    // --------------------------------------------------
    // 10. LOAD ALL FOUR GEOJSON FILES
    // --------------------------------------------------

    async function loadGeoJSON(filename) {
      const url = new URL(filename, document.baseURI);
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          `Failed to load ${filename}: HTTP ${response.status}. URL: ${url.href}`
        );
      }

      const data = await response.json();

      if (
        !data ||
        data.type !== 'FeatureCollection' ||
        !Array.isArray(data.features)
      ) {
        throw new Error(
          `${filename} is not a valid GeoJSON FeatureCollection.`
        );
      }

      return data;
    }

    // --------------------------------------------------
    // 11. LOAD AND DISPLAY THE MAP
    // --------------------------------------------------

    async function loadMapData() {
      try {
        statusBox.textContent = 'Loading map data...';

        const [branches, points, territories, villages] =
          await Promise.all([
            loadGeoJSON('./branch.geojson'),
            loadGeoJSON('./loan_points.geojson'),
            loadGeoJSON('./branch_territories.geojson'),
            loadGeoJSON('./village_territories.geojson')
          ]);

        // Load features into their respective layers.
        branchLayer.addData(branches);
        loanPointsLayer.addData(points);
        territoryLayer.addData(territories);
        villageLayer.addData(villages);

        // Display all four layers initially.
        territoryLayer.addTo(map);
        loanPointsLayer.addTo(map);

        // --------------------------------------------------
        // 12. LAYER CONTROL
        // --------------------------------------------------

        L.control.layers(null, {
          'Branch Territories': territoryLayer,
          'Village Boundaries': villageLayer,
          'Loan Points': loanPointsLayer,
          'Branch Pins': branchLayer
        }, {
          collapsed: false
        }).addTo(map);

        // --------------------------------------------------
        // 13. ZOOM TO ALL FEATURES
        // --------------------------------------------------

        const combined = L.featureGroup([
          territoryLayer,
          villageLayer,
          loanPointsLayer,
          branchLayer
        ]);

        const bounds = combined.getBounds();

        if (bounds.isValid()) {
          map.fitBounds(bounds, {
            padding: [25, 25],
            maxZoom: 12
          });
        } else {
          map.setView([22.5, 79.5], 5);
        }

        // --------------------------------------------------
        // 14. DISPLAY FEATURE COUNTS
        // --------------------------------------------------

        console.log('Branch points:', branches.features.length);
        console.log('Loan points:', points.features.length);
        console.log('Branch territories:', territories.features.length);
        console.log('Village boundaries:', villages.features.length);

        statusBox.textContent =
          `Loaded | Branches: ${branches.features.length}` +
          ` | Loans: ${points.features.length}` +
          ` | Territories: ${territories.features.length}` +
          ` | Villages: ${villages.features.length}`;

      } catch (error) {
        console.error('Map loading error:', error);

        statusBox.textContent = 'Map loading failed: ' + error.message;

        alert(
          'Unable to load map data.\n\n' +
          error.message +
          '\n\nOpen F12 > Console for details.'
        );
      }
    }

    // Start loading the map.
    loadMapData();

  </script>
</body>
</html>
